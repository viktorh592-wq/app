name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # V3.0.9 — allows running analyze + tests on a feature branch on demand
  # (dispatch with ref=<branch>) before cutting an APK build.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
