name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java --version

      - name: Clean project (Safe)
        run: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          # НЕ удаляем android/.gradle и android/gradle/wrapper
          flutter pub cache clean --force

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading missing gradle-wrapper.jar..."
            mkdir -p android/gradle/wrapper
            curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.14.2/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Fix Android settings.gradle.kts
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  val localPropertiesFile = file("local.properties")
                  if (localPropertiesFile.exists()) {
                      localPropertiesFile.inputStream().use { properties.load(it) }
                  }
                  val flutterPath = properties.getProperty("flutter.sdk")
                  require(!flutterPath.isNullOrEmpty()) { "flutter.sdk not set in local.properties" }
                  flutterPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          include(":app")
          EOF

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokatuha-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
