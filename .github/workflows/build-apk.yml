name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Clean Flutter project
        run: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          rm -rf android/.gradle/
          rm -rf android/app/.cxx/

      - name: Fix Android files for CI
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath: String = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterPath = properties.getProperty("flutter.sdk")
                  require(!flutterPath.isNullOrEmpty()) { "flutter.sdk not set in local.properties" }
                  flutterPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }

          include(":app")
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Find APK
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokatuha-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
