name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Build APK with Flutter
        id: flutter_build
        continue-on-error: true
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Fallback build with Gradle (if Flutter step failed)
        if: steps.flutter_build.outcome == 'failure'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --stacktrace --info

      - name: Collect APK files
        run: |
          mkdir -p artifacts
          find build/app/outputs -type f -name "*.apk" -exec cp -f {} artifacts/ \; 2>/dev/null || true
          find android/app/build/outputs -type f -name "*.apk" -exec cp -f {} artifacts/ \; 2>/dev/null || true

          shopt -s nullglob
          apks=(artifacts/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "APK files not found"
            exit 1
          fi

          echo "Found APK files:"
          ls -la artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: artifacts/*.apk
          if-no-files-found: error
