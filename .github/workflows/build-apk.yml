name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # Включаем встроенный кэш pub-пакетов

      # ЭТОТ ШАГ КРИТИЧЕСКИ ВАЖЕН! Он скачивает SDK и принимает все лицензии
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java --version

      - name: Clean project
        run: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          rm -rf android/.gradle/
          rm -rf android/app/.cxx/

      # Создаем local.properties ДО того, как Gradle попытается его прочитать
      # $FLUTTER_ROOT автоматически создается экшеном subosito/flutter-action
      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Fix Android files for CI
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  val localPropertiesFile = file("local.properties")
                  if (localPropertiesFile.exists()) {
                      localPropertiesFile.inputStream().use { properties.load(it) }
                  }
                  val flutterPath = properties.getProperty("flutter.sdk")
                  require(!flutterPath.isNullOrEmpty()) { "flutter.sdk not set in local.properties" }
                  flutterPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }

          include(":app")
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-bin.zip
          EOF

      # Кэшируем Gradle, чтобы повторные билды летали
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Find APK
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokatuha-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
