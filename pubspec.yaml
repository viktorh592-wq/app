name: pokatuha
description: "Pokatuha — privacy-first, local-first P2P activity coordination platform for cyclists, hikers and outdoor communities."
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sembast: ^3.8.3
  sembast_web: ^2.4.0+2
  path_provider: ^2.1.5

  uuid: ^4.5.1
  intl: 0.19.0

  provider: ^6.1.2
  get_it: ^8.0.3

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  http: ^1.2.2
  geolocator: ^13.0.2

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  image_picker: ^1.1.2
  file_picker: ^8.1.6

  flutter_webrtc: ^0.12.5+hotfix.1

  xml: ^6.5.0

  shared_preferences: ^2.3.3
  collection: ^1.18.0
  path: ^1.9.0

  # --- V3 Sprint 1: user discovery & map actions (USER_DISCOVERY.md §2,
  # MAPS_AND_GPS_FIX.md §5). Justification per AGENTS.md:
  # qr_flutter — render the profile/group QR code (USER_DISCOVERY.md §2)
  # mobile_scanner — scan QR codes (USER_DISCOVERY.md §2)
  # share_plus — share invite links / exported GPX (USER_DISCOVERY.md §2)
  # url_launcher — open external https links from invite QR payloads
  # flutter_foreground_task — background location service (MAPS_AND_GPS_FIX.md §3)
  # record / just_audio — voice messages (TELEGRAM_STYLE_CHAT.md §9)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_foreground_task: ^8.10.0
  record: ^5.1.2
  just_audio: ^0.9.40

dependency_overrides:
  intl: 0.19.0
  # S6-T1: pin record_platform_interface to 1.5.0 to avoid the
  # hasPermission signature breakage introduced in 1.6.0 — record_linux
  # 0.7.2 (the only 0.x release, transitively pulled by `record: ^5.1.2`)
  # has not been updated to implement the new abstract member. 1.5.0 is
  # the last version all federated implementations (record_android ^1.5.0,
  # record_darwin ^1.2.0, record_web ^1.5.0, record_windows ^1.4.0,
  # record_linux ^1.0.2) accept.
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
