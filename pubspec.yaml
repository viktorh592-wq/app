name: pokatuha
description: "Pokatuha — privacy-first, local-first P2P activity coordination platform for cyclists, hikers and outdoor communities."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sembast: ^3.8.4+1
  sembast_web: ^2.4.0+2
  path_provider: ^2.1.5

  uuid: ^4.5.1
  intl: 0.19.0

  provider: ^6.1.2
  get_it: ^8.0.3

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  http: ^1.2.2
  geolocator: ^13.0.2

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  image_picker: ^1.1.2
  file_picker: ^8.1.6

  flutter_webrtc: ^0.12.5+hotfix.1

  xml: ^6.5.0

  shared_preferences: ^2.3.3
  collection: ^1.18.0
  path: ^1.9.0

# ЭТОТ РАЗДЕЛ ПРИНУДИТЕЛЬНО ЗАДАЁТ ВЕРСИЮ И ИСПРАВЛЯЕТ ОШИБКУ
dependency_overrides:
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
